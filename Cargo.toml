[package]
name = "im-service"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.45", features = ["serde"] }
club-auth-sdk = { version = "0.1.0", path = "libs/crates/auth-sdk" }
club-bus = { version = "0.1.0", path = "libs/crates/bus" }
club-common = { version = "0.1.0", path = "libs/crates/common" }
futures-util = "0.3.34"
jsonwebtoken = "9"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
sea-orm = { version = "2.0.2", features = ["runtime-tokio-rustls", "sqlx-postgres", "macros", "with-uuid", "with-chrono", "with-json"] }
sea-orm-migration = { version = "2.0.2", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.26.1", features = ["v7", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
rand_core = { version = "0.6", features = ["getrandom"] }
rsa = { version = "0.9", features = ["pem"] }
tower = { version = "0.5.3", features = ["util"] }
